services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: yuna-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT : réseau Docker (schema-registry) / PLAINTEXT_HOST : services lancés sur la machine hôte
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    container_name: yuna-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8081 est utilisé par order-service : le registry est exposé sur 8085 côté hôte
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      # Un nouveau schéma doit rester lisible par les consommateurs existants
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: FULL_TRANSITIVE
    healthcheck:
      # L'image ne contient ni curl ni wget : requête HTTP via /dev/tcp de bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.6
    container_name: yuna-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yuna
      POSTGRES_PASSWORD: yuna
      POSTGRES_DB: postgres
    volumes:
      # Crée orderdb, inventorydb et paymentdb au premier démarrage (une base par microservice)
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Postgres 18+ : le volume se monte sur /var/lib/postgresql (les données vont dans /var/lib/postgresql/18/docker)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
