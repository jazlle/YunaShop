databaseChangeLog:
  - changeSet:
      id: 002-create-reservations
      author: yunashop
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: customer_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reservations_product
                    references: products(id)
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: numeric(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
