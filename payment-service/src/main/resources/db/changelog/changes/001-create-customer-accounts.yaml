databaseChangeLog:
  - changeSet:
      id: 001-create-customer-accounts
      author: yunashop
      changes:
        - createTable:
            tableName: customer_accounts
            columns:
              - column:
                  name: customer_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: balance
                  type: numeric(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
        - sql:
            sql: ALTER TABLE customer_accounts ADD CONSTRAINT chk_customer_accounts_balance CHECK (balance >= 0)
